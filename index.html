<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teletrabajo · Hematología · Gregorio Marañón</title>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --linen:#F5FAFC; --panel:#FFFFFF; --ink:#24333B; --ink-soft:#6E8896;
    --line:#D9E7EE; --maroon:#4A90B8; --maroon-deep:#2C6E8C; --pink-pale:#D9EEF6;
    --pink-wash:#EFF9FC; --weekend:#EAF3F7;
    --amber:#C9A227; --plum:#8B5A72; --teal:#3E7C8C;
    --code-t:#F5DE8A; --code-t-text:#6B5710;
    --code-v:#4C9A5B;
    --code-im:#8C8C90;
    --code-b:#F5B87A; --code-b-text:#6B3D10;
    --warn:#C0392B; --warn-pale:#FBEAE8; --ok:#3D8A5F; --ok-pale:#E7F5EC;
    --dayevent:#ECE1F7; --dayevent-ring:#B79BDB; --dayevent-text:#5B3E82;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--linen); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; padding:20px 20px 60px; }
  .wrap{max-width:1240px;margin:0 auto;}

  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:18px; border-bottom:2px solid var(--pink-pale); padding-bottom:14px; }
  .masthead .brand{ display:flex; align-items:center; gap:12px; }
  .masthead .brand img{ width:52px; height:52px; border-radius:12px; object-fit:cover; box-shadow:0 1px 4px rgba(32,73,93,.18); }
  .masthead h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:25px; letter-spacing:-0.01em;
    color:var(--maroon-deep); margin:0 0 1px; }
  .masthead .sub{ font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.07em; font-weight:500; }

  .mode-toggle{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:relative; }
  .mode-pill{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; letter-spacing:.03em;
    padding:9px 16px; border-radius:999px; border:1.5px solid var(--maroon); background:var(--maroon); color:#fff;
    cursor:pointer; transition:transform .12s ease; }
  .mode-pill.view{ background:transparent; color:var(--maroon); }
  .mode-pill:hover{ transform:translateY(-1px); }
  .mode-note{ font-size:11px; color:var(--ink-soft); max-width:190px; line-height:1.35; }

  .pw-panel{ display:none; align-items:center; gap:6px; background:var(--panel); border:1.5px solid var(--maroon);
    border-radius:10px; padding:8px; position:absolute; top:44px; right:0; z-index:20; box-shadow:0 4px 16px rgba(32,73,93,.15); }
  .pw-panel input{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; width:140px; }
  .pw-panel button{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700; padding:6px 10px;
    border-radius:6px; border:1.5px solid var(--maroon); background:var(--maroon); color:#fff; cursor:pointer; white-space:nowrap; }
  .pw-panel button.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }

  .controls{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; padding:8px 14px;
    border-radius:8px 8px 0 0; border:1.5px solid var(--maroon-deep); border-bottom:none; background:var(--panel);
    color:var(--ink-soft); cursor:pointer; position:relative; top:1px; }
  .tab.active{ background:var(--maroon-deep); color:#fff; }
  .tab.tab-summary{ border-color:var(--teal); margin-left:6px; }
  .tab.tab-summary.active{ background:var(--teal); border-color:var(--teal); }

  .monthnav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .monthnav button.round{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--maroon-deep);
    background:var(--panel); color:var(--maroon-deep); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .monthnav button.round:hover{ background:var(--pink-wash); }
  .monthlabel{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; min-width:140px; text-align:center; }
  .pillbtn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700; letter-spacing:.03em;
    padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--panel);
    color:var(--ink-soft); cursor:pointer; }
  .pillbtn:hover{ border-color:var(--maroon); color:var(--maroon-deep); }
  .pillbtn.on{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .pillbtn.auto{ border-color:var(--teal); color:var(--teal); }
  .pillbtn.request{ border-color:var(--plum); color:var(--plum); }
  .export-btn{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; padding:7px 12px;
    border-radius:7px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink-soft); cursor:pointer; }
  .export-btn:hover{ border-color:var(--maroon); color:var(--maroon-deep); }

  .info-line{ font-size:12px; color:var(--ink-soft); margin:0 0 8px 2px; }
  .info-line b{ color:var(--ink); }

  .notebar{ background:var(--pink-wash); border:1.5px solid var(--pink-pale); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:14px; font-size:13px; color:var(--maroon-deep); display:flex; gap:10px; align-items:flex-start; }
  .notebar .tag{ font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; background:var(--maroon); color:#fff; padding:3px 7px; border-radius:5px; flex-shrink:0; margin-top:1px; }
  .notebar textarea{ width:100%; border:none; background:transparent; resize:vertical; font-family:'IBM Plex Sans', sans-serif;
    font-size:13px; color:var(--maroon-deep); min-height:20px; outline:none; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:14px; padding:10px 14px; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); font-size:12px; color:var(--ink-soft); }
  .legend .item{ display:flex; align-items:center; gap:6px; }
  .legend .dot{ width:11px; height:11px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,.15); }
  .legend .item b{ color:var(--ink); font-weight:600; }

  .tablewrap{ overflow-x:auto; border:1.5px solid var(--maroon-deep); border-radius:var(--radius); background:var(--panel);
    -webkit-overflow-scrolling:touch; }
  table{ border-collapse:collapse; font-family:'IBM Plex Mono', monospace; }
  thead th{ position:sticky; background:var(--maroon-deep); color:#fff; z-index:3; font-weight:600; padding:0;
    border-bottom:1.5px solid var(--maroon-deep); }
  thead tr.hrow1 th{ top:0; }
  thead tr.hrow2 th{ top:19px; }
  th.namehead{ left:0; top:0; z-index:5; text-align:left; padding:8px 12px; font-family:'IBM Plex Sans', sans-serif;
    font-size:12px; min-width:200px; background:var(--maroon-deep); }
  th.totalhead{ top:0; }
  th.daycell{ width:34px; text-align:center; border-left:1px solid rgba(255,255,255,.12); }
  th.daycell .wd{ font-size:9.5px; opacity:.7; line-height:14px; padding-top:5px; }
  th.daycell .num{ font-size:12px; line-height:14px; padding-bottom:5px; }
  th.daycell.weekend{ background:#4A87A3; }
  th.daycell.warnday{ background:var(--warn); }
  th.daycell.exday{ background:var(--plum); }
  tbody td{ border-bottom:1px solid var(--line); border-left:1px solid var(--line); }
  td.namecell{ position:sticky; left:0; background:var(--panel); z-index:2; padding:7px 12px;
    font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; font-weight:500; white-space:nowrap;
    border-right:1.5px solid var(--maroon-deep); display:flex; align-items:center; gap:6px; min-width:200px; }
  td.namecell.excluded{ background:var(--pink-wash); }
  .crown{ font-size:11px; }
  td.daycell{ width:34px; height:34px; text-align:center; font-size:11px; font-weight:600; color:var(--ink-soft);
    cursor:default; user-select:none; }
  td.daycell.editable{ cursor:pointer; }
  td.daycell.editable:hover{ outline:1.5px solid var(--maroon); outline-offset:-1.5px; }
  td.daycell.weekend{ background:var(--weekend); }
  td.daycell.blank{ opacity:.4; }
  td.daycell.T{ background:var(--code-t); color:var(--code-t-text); }
  td.daycell.V{ background:var(--code-v); color:#fff; }
  td.daycell.P{ background:var(--plum); color:#fff; }
  td.daycell.IM{ background:var(--code-im); color:#fff; }
  td.daycell.B{ background:var(--code-b); color:var(--code-b-text); }
  td.daycell.C{ background:var(--teal); color:#fff; }
  td.daycell.todaycol{ box-shadow:inset 0 0 0 2px var(--maroon-deep); }
  td.daycell.conflict{ box-shadow:inset 0 0 0 2px var(--warn); }
  td.daycell.exok{ box-shadow:inset 0 0 0 2px var(--plum); }
  td.totalcell{ width:52px; text-align:center; font-size:12px; font-weight:600; background:var(--pink-wash); color:var(--maroon-deep); }
  tr.onsite-row td{ background:#2E5568; color:#fff; font-weight:600; font-size:11px; }
  tr.onsite-row td.namecell{ background:#2E5568; color:#fff; }
  tr.onsite-row td.daycell.weekend{ background:#23404D; color:#AFD0DD; }

  .panelbox{ margin-top:14px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .panelbox h3{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; margin:0; padding:10px 14px;
    background:var(--maroon-deep); color:#fff; display:flex; justify-content:space-between; align-items:center; }
  .panel-empty{ padding:12px 14px; font-size:12.5px; color:var(--ok); background:var(--ok-pale); font-weight:600; }
  .alert-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 14px; font-size:12.5px;
    border-top:1px solid var(--line); }
  .alert-row.active{ background:var(--warn-pale); }
  .alert-row.approved{ background:var(--ok-pale); }
  .alert-row.pending{ background:var(--pink-wash); }
  .alert-row.rejected{ background:var(--linen); opacity:.7; }
  .alert-day{ font-family:'IBM Plex Mono', monospace; font-weight:700; color:var(--ink); min-width:52px; }
  .alert-msg{ flex:1; min-width:200px; color:var(--ink); }
  .alert-badge{ font-size:11px; font-weight:700; color:var(--ok); }
  .alert-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700; padding:5px 11px;
    border-radius:999px; border:1.5px solid var(--maroon); background:var(--maroon); color:#fff; cursor:pointer; }
  .alert-btn.revoke, .alert-btn.reject{ background:transparent; color:var(--warn); border-color:var(--warn); }
  .history-toggle{ padding:7px 14px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; border-top:1px solid var(--line); background:var(--linen); }

  .summary-table{ width:100%; border-collapse:collapse; background:var(--panel); font-family:'IBM Plex Sans',sans-serif; font-size:13px; }
  .summary-table th{ background:var(--maroon-deep); color:#fff; text-align:left; padding:9px 12px; font-weight:600; font-size:12px; }
  .summary-table td{ padding:8px 12px; border-bottom:1px solid var(--line); }
  .summary-table tr:nth-child(even) td{ background:#FDFAF9; }
  .summary-table td.num{ font-family:'IBM Plex Mono', monospace; font-weight:600; text-align:center; }
  .summary-table tr.excluded-row td{ background:var(--pink-wash); }

  .events-banner{ display:none; background:var(--dayevent); border:1.5px solid var(--dayevent-ring); border-radius:var(--radius); padding:10px 14px;
    margin-bottom:14px; font-size:12.5px; color:var(--dayevent-text); line-height:1.5; }
  .events-banner b{ font-weight:700; }

  .pending-reminder{ display:none; background:var(--pink-wash); border:1.5px solid var(--plum); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:var(--ink); line-height:1.5; }
  .pending-reminder b{ color:var(--plum); }

  th.daycell.dayevent-col{ background:var(--dayevent) !important; color:var(--dayevent-text) !important; }
  td.daycell.dayevent-col.blank{ background:var(--dayevent); color:var(--dayevent-text); opacity:1; }
  td.daycell.dayevent-col:not(.blank):not(.weekend){ box-shadow: inset 0 0 0 3px var(--dayevent-ring); }
  td.daycell.dayevent-col.todaycol{ box-shadow: inset 0 0 0 3px var(--dayevent-ring), inset 0 0 0 1px var(--maroon-deep); }
  tr.onsite-row td.daycell.dayevent-col{ background:var(--dayevent); color:var(--dayevent-text); }

  tr.event-row td.namecell{ background:var(--pink-wash); font-weight:700; color:var(--maroon-deep); font-family:'IBM Plex Sans', sans-serif; font-size:11px; letter-spacing:.04em; }
  tr.event-row td.daycell{ background:var(--pink-wash); font-size:13px; font-weight:700; color:var(--ink-soft); cursor:default; }
  tr.event-row td.daycell.editable{ cursor:pointer; }
  tr.event-row td.daycell.editable:hover{ outline:1.5px solid var(--maroon); outline-offset:-1.5px; }
  tr.event-row td.daycell.set{ background:var(--dayevent); color:var(--dayevent-text); }
  tr.event-row td.daycell.weekend{ background:var(--weekend); color:var(--ink-soft); opacity:.5; }
  tr.event-row td.totalcell{ background:transparent; }
  tr.event-row:last-of-type td{ border-bottom:2px solid var(--maroon-deep); }


  .req-panel{ display:none; background:var(--panel); border:1.5px solid var(--plum); border-radius:var(--radius);
    padding:14px; margin-bottom:14px; }
  .req-panel h4{ margin:0 0 10px; font-family:'Space Grotesk', sans-serif; font-size:13.5px; color:var(--plum); }
  .req-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
  @media (max-width:700px){ .req-grid{ grid-template-columns:1fr; } }
  .req-panel label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .req-panel select, .req-panel input, .req-panel textarea{ width:100%; padding:7px 9px; border:1px solid var(--line);
    border-radius:6px; font-size:12.5px; font-family:'IBM Plex Sans', sans-serif; }
  .req-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .req-actions button{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:700; padding:8px 16px;
    border-radius:999px; border:1.5px solid var(--plum); background:var(--plum); color:#fff; cursor:pointer; }
  .req-actions button.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }

  .settings-toggle{ margin-top:16px; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    background:none; border:1.5px dashed var(--line); color:var(--ink-soft); padding:9px 14px; border-radius:8px;
    cursor:pointer; width:100%; text-align:left; }
  .settings-toggle:hover{ border-color:var(--maroon); color:var(--maroon-deep); }
  .settings-panel{ margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px){ .settings-panel{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .card h3{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; margin:0 0 10px; color:var(--maroon-deep); }
  .member-row{ display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:12.5px;
    border-bottom:1px solid var(--linen); gap:8px; }
  .member-row .mname{ flex:1; }
  .member-row .mopts{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-soft); }
  .member-row button{ border:none; background:none; color:var(--warn); cursor:pointer; font-size:15px; line-height:1; padding:2px 6px; }
  .addmember{ display:flex; gap:6px; margin-top:8px; }
  .addmember input{ flex:1; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:'IBM Plex Sans', sans-serif; }
  .addmember button{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; border:1.5px solid var(--maroon);
    background:var(--maroon); color:#fff; cursor:pointer; }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .field input[type=number], .field input[type=text], .field input[type=date], .field input[type=month], .field input[type=password]{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;
    font-family:'IBM Plex Sans', sans-serif; }
  .pair-row{ display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:12px; border-bottom:1px solid var(--linen); }
  .pair-row button{ border:none; background:none; color:var(--warn); cursor:pointer; font-size:15px; padding:2px 6px; }
  .addpair{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .addpair select{ flex:1; min-width:120px; font-size:12px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; }
  .addpair button{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; border:1.5px solid var(--maroon); background:var(--maroon); color:#fff; cursor:pointer; }
  .daychecks label{ display:inline-flex; align-items:center; gap:3px; font-size:11.5px; margin-right:9px; }
  .subrule{ border-top:1px dashed var(--line); padding-top:8px; margin-top:8px; }
  .subrule .rulename{ font-weight:600; font-size:12px; margin-bottom:5px; }
  .muted{ color:var(--ink-soft); font-size:12px; }
  .legend-edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .legend-edit-row .dot{ width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .legend-edit-row code{ font-size:11px; width:26px; color:var(--ink-soft); }
  .legend-edit-row input{ flex:1; padding:5px 7px; border:1px solid var(--line); border-radius:5px; font-size:12px; }
  .pwchange-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:flex-end; }
  .pwchange-row .field{ flex:1; min-width:110px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--maroon-deep);
    color:#fff; padding:9px 18px; border-radius:999px; font-size:12.5px; font-weight:500; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:50; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .help{ font-size:11.5px; color:var(--ink-soft); margin:8px 2px 0; line-height:1.5; }
  .footnote{ font-size:11px; color:var(--ink-soft); margin-top:26px; text-align:center; line-height:1.6; }

  @media print{ .no-print{ display:none !important; } body{ background:#fff; padding:0; } .tablewrap{ border:1px solid #000; } }
</style>
</head>
<body>
<div class="wrap">
